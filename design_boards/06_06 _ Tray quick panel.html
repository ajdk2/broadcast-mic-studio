<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:640}}">
class Component extends DCLogic {
  renderVals() {
    const fr = (x) => x - Math.floor(x);
    let wave = '';
    for (let i = 0; i < 49; i++) {
      const x = 3 + i * 6;
      const r = fr(Math.sin(i * 12.9898) * 43758.5453);
      const e = Math.abs(Math.sin(i * 0.31)) * Math.max(0, Math.sin(i * 0.1 + 0.4));
      const h = e > 0.07 ? Math.min(18, 3 + 16 * Math.pow(e * (0.75 + 0.25 * r), 0.5)) : 1;
      wave += 'M' + x + ' ' + (20 - h).toFixed(1) + 'V' + (20 + h).toFixed(1);
    }
    return { wave };
  }
}
</script>
