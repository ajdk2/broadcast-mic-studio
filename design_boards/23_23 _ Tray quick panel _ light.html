body{margin:0;background:#E9E7E2;color:#1A1B1E;font-family:'Geist','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#A35F00;text-decoration:none}a:hover{color:#7A4700}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #F5A623;outline-offset:2px}
.mono{font-family:'Geist Mono','Cascadia Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
div:has(> .range:focus-visible){outline:2px solid #F5A623;outline-offset:4px;border-radius:8px}
.range{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
</style>
</helmet>
<div style="width: 400px; height: 640px; box-sizing: border-box; padding: 20px; background: #E9E7E2; display: flex; align-items: flex-end">
<div role="dialog" aria-label="Aurel quick panel" style="width: 360px; display: flex; flex-direction: column; gap: 16px; padding: 18px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #DCD9D3; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.18)">

<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="32" height="32" sc-camel-view-box="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#F5A623"></rect><path d="M8 14v0M11 10.5v7M14 7.5v13M17 10.5v7M20 13.5v1" stroke="#1B1204" stroke-width="2.2" stroke-linecap="round"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">Aurel</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4B4E56"><span style="width: 6px; height: 6px; border-radius: 50%; background: #43D18A"></span>Enhancing · Teams is listening</span>
</div>
</div>
<button type="button" role="switch" aria-checked="true" aria-label="Enhancement" style="width: 44px; height: 26px; border-radius: 13px; background: #F5A623; display: flex; align-items: center; justify-content: flex-end; padding: 3px; box-sizing: border-box; border: 0; cursor: pointer"><span style="width: 20px; height: 20px; border-radius: 50%; background: #1B1204"></span></button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 10px; background: #FAF9F6; border: 1px solid #DCD9D3">
<svg width="294" height="40" sc-camel-view-box="0 0 294 40" aria-hidden="true"><path d="{{wave}}" stroke="#F5A623" stroke-width="3" stroke-linecap="round" fill="none"></path></svg>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:640}}">
class Component extends DCLogic {
  renderVals() {
    const fr = (x) => x - Math.floor(x);
    let wave = '';
    for (let i = 0; i < 49; i++) {
      const x = 3 + i * 6;
      const r = fr(Math.sin(i * 12.9898) * 43758.5453);
      const e = Math.abs(Math.sin(i * 0.31)) * Math.max(0, Math.sin(i * 0.1 + 0.4));
      const h = e > 0.07 ? Math.min(18, 3 + 16 * Math.pow(e * (0.75 + 0.25 * r), 0.5)) : 1;
      wave += 'M' + x + ' ' + (20 - h).toFixed(1) + 'V' + (20 + h).toFixed(1);
    }
    return { wave };
  }
}
</script>
