name: Windows installer

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Type-checks, bundles, then packages. electron-builder rebuilds better-sqlite3 for Electron.
      - name: Build installer
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: Aurel-Voice-Studio-Setup
          path: release/*.exe
          if-no-files-found: error
